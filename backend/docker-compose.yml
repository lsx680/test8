services:
  mysql:
    image: mysql:8.0.36
    container_name: oes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: oes
      MYSQL_USER: oes_app
      MYSQL_PASSWORD: oes_app_pwd
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - oes-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pwd"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  oes-mysql-data:
